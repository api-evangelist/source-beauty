description: 'Source Beauty is an online beauty and wellbeing marketplace serving Egypt, selling skincare,
  makeup, fragrance, hair care, body care, K-beauty and wellness/supplement products from hundreds of local
  Egyptian and international brands. The consumer-facing storefront (sourcebeauty.com) offers curated brand
  pages, bundles and gift sets, promotional offers, bilingual English/Arabic shopping, and free shipping on
  qualifying orders. Source Beauty is a 500 Global portfolio company. As of this enrichment pass the company
  operates a direct-to-consumer e-commerce website only and publishes no public developer program, API,
  SDKs, or technical documentation.'
